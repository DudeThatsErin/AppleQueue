<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apple Queue</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: #0f172a;
    color: #e2e8f0;
  }
  /* Sidebar/tab views get real breathing room instead of the toolbar-popup width */
  body.expanded {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    margin: 0 auto;
  }
  header {
    background: linear-gradient(to right, #0f172a, #1e293b);
    border-bottom: 1px solid #1e293b;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 14px; font-weight: 700; color: #f59e0b; }
  header a { font-size: 11px; color: #64748b; text-decoration: none; }
  header a:hover { color: #94a3b8; }
  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 6px 8px;
    background: #1e293b; border: 1px solid #334155; border-radius: 5px;
    color: #e2e8f0; font-size: 13px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: #f59e0b; }

  /* WYSIWYG toolbar + editor */
  .editor-wrap { border: 1px solid #334155; border-radius: 5px; overflow: hidden; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1px;
    padding: 4px 6px; background: #162032; border-bottom: 1px solid #2d3f55;
  }
  .toolbar select {
    padding: 2px 4px; font-size: 11px; height: 22px; width: auto; max-width: 90px;
    border-radius: 3px; border-color: #2d3f55;
  }
  .toolbar button {
    width: 22px; height: 22px; border: none; border-radius: 3px;
    background: transparent; color: #94a3b8; cursor: pointer;
    font-size: 11px; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .toolbar button:hover { background: #253347; color: #e2e8f0; }
  .toolbar button.active { background: #f59e0b22; color: #f59e0b; }
  .tb-sep { width: 1px; height: 16px; background: #334155; margin: 0 2px; flex-shrink: 0; }
  #editor {
    min-height: 100px; max-height: 220px; overflow-y: auto;
    padding: 8px 10px; outline: none;
    font-size: 13px; line-height: 1.55; color: #e2e8f0;
    background: #1e293b;
  }
  #editor:empty::before { content: 'Content…'; color: #475569; pointer-events: none; }
  #editor p { margin: 0 0 2px; }
  #editor h1 { font-size: 1.35em; font-weight: 700; margin: 2px 0; color: #f8fafc; }
  #editor h2 { font-size: 1.1em; font-weight: 700; margin: 2px 0; }
  #editor h3 { font-size: 1em; font-weight: 600; margin: 2px 0; color: #cbd5e1; }
  #editor pre { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; background: #0f172a; padding: 4px 7px; border-radius: 4px; margin: 3px 0; white-space: pre-wrap; }
  #editor ul, #editor ol { padding-left: 18px; margin: 2px 0; }
  #editor ul.task-list { list-style: none; padding-left: 2px; }
  #editor ul.task-list li { display: flex; align-items: flex-start; gap: 5px; padding: 1px 0; }
  #editor ul.task-list li input[type="checkbox"] { margin-top: 3px; flex-shrink: 0; accent-color: #f59e0b; cursor: pointer; }
  #editor a { color: #60a5fa; }
  #editor blockquote { border-left: 3px solid #475569; margin: 3px 0; padding-left: 8px; color: #94a3b8; }
  .row { display: grid; grid-template-columns: 1fr 130px; gap: 8px; }
  .type-tabs { display: flex; gap: 6px; }
  .type-tab {
    flex: 1; text-align: center; padding: 6px 4px; border-radius: 5px;
    background: #1e293b; border: 1px solid #334155; color: #94a3b8;
    cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .type-tab.active { background: #f59e0b22; border-color: #f59e0b; color: #f59e0b; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; }
  .checkbox-row input { width: 16px; height: 16px; flex: none; }
  .checkbox-row label { margin: 0; cursor: pointer; }
  .drop-zone {
    border: 2px dashed #334155; border-radius: 5px;
    padding: 8px 10px; text-align: center; cursor: pointer;
    color: #475569; font-size: 11px; transition: border-color 0.15s;
  }
  .drop-zone:hover { border-color: #475569; color: #64748b; }
  .file-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .chip {
    display: flex; align-items: center; gap: 4px;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 4px; padding: 2px 6px; font-size: 11px; color: #94a3b8;
  }
  .chip button { background: none; border: none; color: #64748b; cursor: pointer; font-size: 11px; padding: 0; line-height: 1; }
  .btn {
    padding: 7px 14px; border: none; border-radius: 5px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-amber { background: #f59e0b; color: #0f172a; width: 100%; }
  .btn-amber:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 12px; text-align: center; min-height: 18px; }
  .status.ok { color: #34d399; }
  .status.err { color: #f87171; }
  .hidden { display: none !important; }

  /* Natural-language capture */
  #ai-section {
    background: #15203a; border: 1px solid #2b3b57;
    border-radius: 6px; padding: 8px;
  }
  #ai-input {
    width: 100%; min-height: 46px; resize: vertical;
    padding: 6px 8px; background: #1e293b;
    border: 1px solid #334155; border-radius: 5px;
    color: #e2e8f0; font-size: 13px; font-family: inherit; line-height: 1.45;
  }
  #ai-input:focus { outline: none; border-color: #818cf8; }
  #ai-input::placeholder { color: #475569; }
  .ai-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .btn-ai {
    background: #6366f1; color: #f8fafc; padding: 5px 12px;
    font-size: 12px; border: none; border-radius: 5px;
    font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .btn-ai:disabled { opacity: 0.55; cursor: default; }
  .ai-hint { font-size: 10px; color: #64748b; }
  #ai-status { font-size: 11px; min-height: 14px; }
  #ai-status.ok { color: #34d399; }
  #ai-status.err { color: #f87171; }
  #ai-status.busy { color: #818cf8; }

  #no-key {
    background: #1e293b; border: 1px solid #f59e0b33; border-radius: 6px;
    padding: 10px 12px; font-size: 12px; color: #94a3b8; text-align: center; display: none;
  }
  #no-key a { color: #f59e0b; }
</style>
</head>
<body>
<header>
  <h1 id="header-title">🍎 Apple Queue</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="#" id="expand-link" title="Open in sidebar or tab">⤢ Expand</a>
    <a href="#" id="settings-link">⚙ Settings</a>
  </div>
</header>

<div id="no-key">
  API key not set. <a href="#" id="settings-link-2">Open Settings →</a>
</div>

<div class="body" id="main-form">
  <!-- Natural language → draft. Hidden unless enabled in Settings. -->
  <div id="ai-section" class="hidden">
    <textarea id="ai-input" rows="2"
      placeholder="Describe it in plain English — “call the vet friday at 3pm”"></textarea>
    <div class="ai-actions">
      <button class="btn-ai" id="ai-parse-btn">✨ Parse</button>
      <span class="ai-hint">Fills the form below — nothing is saved until you press Add.</span>
    </div>
    <div id="ai-status"></div>
  </div>

  <div class="type-tabs">
    <div class="type-tab active" data-type="note">🍎 Note</div>
    <div class="type-tab" data-type="reminder">✅ Reminder</div>
    <div class="type-tab" data-type="event">📅 Event</div>
  </div>

  <div class="row">
    <div>
      <label>Title</label>
      <input id="title" type="text" placeholder="Title" />
    </div>
    <div>
      <label id="secondary-label">Folder</label>
      <input id="secondary" type="text" placeholder="Notes" />
    </div>
  </div>

  <!-- Reminder-only fields -->
  <div id="reminder-fields" class="hidden">
    <div class="row">
      <div>
        <label>Due Date <span style="color:#475569">(optional)</span></label>
        <div style="display:grid;grid-template-columns:1fr 90px;gap:6px">
          <input id="dueDate-date" type="date" />
          <input id="dueDate-time" type="time" />
        </div>
      </div>
      <div>
        <label>Priority</label>
        <select id="priority">
          <option value="none">None</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Event-only fields -->
  <div id="event-fields" class="hidden">
    <div class="checkbox-row" style="margin-bottom:8px">
      <input id="allDay" type="checkbox" />
      <label for="allDay">All-day event</label>
    </div>
    <div class="row" style="margin-bottom:8px;grid-template-columns:1fr 1fr">
      <div>
        <label>Start</label>
        <div style="display:grid;grid-template-columns:1fr 90px;gap:6px">
          <input id="startDate-date" type="date" />
          <input id="startDate-time" type="time" />
        </div>
      </div>
      <div>
        <label>End <span style="color:#475569">(optional)</span></label>
        <div style="display:grid;grid-template-columns:1fr 90px;gap:6px">
          <input id="endDate-date" type="date" />
          <input id="endDate-time" type="time" />
        </div>
      </div>
    </div>
    <label>Location <span style="color:#475569">(optional)</span></label>
    <input id="location" type="text" placeholder="Location" />
  </div>

  <div>
    <label id="body-label">Body</label>
    <div class="editor-wrap">
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Text formatting">
        <select id="fmt-style" aria-label="Text style">
          <option value="p">Body</option>
          <option value="h1">Title</option>
          <option value="h2">Heading</option>
          <option value="h3">Subheading</option>
          <option value="pre">Monospace</option>
        </select>
        <span class="tb-sep" role="separator"></span>
        <button data-cmd="bold" aria-label="Bold"><b>B</b></button>
        <button data-cmd="italic" aria-label="Italic"><i>I</i></button>
        <button data-cmd="underline" aria-label="Underline"><u>U</u></button>
        <button data-cmd="strikeThrough" aria-label="Strikethrough"><s>S</s></button>
        <span class="tb-sep" role="separator"></span>
        <button data-cmd="insertUnorderedList" aria-label="Bullet list">•≡</button>
        <button data-cmd="insertOrderedList" aria-label="Numbered list">1≡</button>
        <button id="btn-checklist" aria-label="Checklist">☑</button>
        <span class="tb-sep" role="separator"></span>
        <button data-cmd="outdent" aria-label="Decrease indent">⇤</button>
        <button data-cmd="indent" aria-label="Increase indent">⇥</button>
        <span class="tb-sep" role="separator"></span>
        <button data-cmd="justifyLeft" aria-label="Align left">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
            <rect x="0" y="1" width="14" height="2" rx="1"/>
            <rect x="0" y="6" width="9" height="2" rx="1"/>
            <rect x="0" y="11" width="14" height="2" rx="1"/>
          </svg>
        </button>
        <button data-cmd="justifyCenter" aria-label="Align center">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
            <rect x="0" y="1" width="14" height="2" rx="1"/>
            <rect x="2.5" y="6" width="9" height="2" rx="1"/>
            <rect x="0" y="11" width="14" height="2" rx="1"/>
          </svg>
        </button>
        <button data-cmd="justifyRight" aria-label="Align right">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
            <rect x="0" y="1" width="14" height="2" rx="1"/>
            <rect x="5" y="6" width="9" height="2" rx="1"/>
            <rect x="0" y="11" width="14" height="2" rx="1"/>
          </svg>
        </button>
      </div>
      <div id="editor" contenteditable="true" spellcheck="true"></div>
    </div>
  </div>

  <!-- Attachments — note only -->
  <div id="attachments-section">
    <label>Attachments <span style="color:#475569">(images, PDF)</span></label>
    <div class="drop-zone" id="drop-zone">Drop files or click to browse</div>
    <input type="file" id="file-input" multiple accept="image/*,.pdf" style="display:none" />
    <div class="file-chips" id="file-chips"></div>
  </div>

  <button class="btn btn-amber" id="submit-btn">Add to Queue</button>
  <div class="status" id="status"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
